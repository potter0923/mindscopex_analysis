# Large-model trap families (trivialized classics, redefinition, memo override) on 27B.
# Reasoning OFF/ON, forced correct-vs-lure, matched controls included. Same protocol
# as 01_* so the arithmetic drafts and these families compare directly.
[run]
name = "02_kanghun_traps_v2_27b"
job = "crt_text_responses"

[dataset]
id = "kanghun_traps_v2"
include_controls = true

[model]
ids = ["Qwen/Qwen3.5-27B"]
dtype = "auto"
device_map = "auto"

[generation]
protocol = "qwen_native"
seeds = [42]
thinking_modes = [false, true]
output_mode = "binary_choice"
max_new_tokens = 2048

[colab]
gpu = "G4"

[remote]
source = "archive"
repo_dir = "/content/mindscopex_analysis"
output_root = "/content/mindscopex_artifacts"
