# Pilot screen: do the draft independent traps fire on 27B at all?
# Reasoning OFF/ON, forced correct-vs-lure. Matched controls run too: an item is
# usable only if the trap draws the lure with thinking off AND its control is right.
[run]
name = "01_kanghun_traps_27b"
job = "crt_text_responses"

[dataset]
id = "kanghun_traps_v1"
include_controls = true

[model]
ids = ["Qwen/Qwen3.5-27B"]
dtype = "auto"
device_map = "auto"

[generation]
protocol = "qwen_native"
seeds = [42]
thinking_modes = [false, true]
output_mode = "binary_choice"
max_new_tokens = 2048

[colab]
gpu = "G4"

[remote]
source = "archive"
repo_dir = "/content/mindscopex_analysis"
output_root = "/content/mindscopex_artifacts"
