# Stage 2 of the scaled memo-override screen: thinking ON, stage-1 survivors' traps only.
[run]
name = "07b_kanghun_traps_v7_27b_on"
job = "crt_text_responses"

[dataset]
id = "kanghun_traps_v7s2"
include_controls = false

[model]
ids = ["Qwen/Qwen3.5-27B"]
dtype = "auto"
device_map = "auto"

[generation]
protocol = "qwen_native"
seeds = [42]
thinking_modes = [true]
output_mode = "binary_choice"
max_new_tokens = 2048

[colab]
gpu = "G4"

[remote]
source = "archive"
repo_dir = "/content/mindscopex_analysis"
output_root = "/content/mindscopex_artifacts"
