# Stage 1 of the scaled memo-override screen: thinking OFF only, traps + controls.
# Keeps pairs whose trap takes the lure and whose control is right (scripts/two_stage_screen.py subset).
[run]
name = "07_kanghun_traps_v7_27b_off"
job = "crt_text_responses"

[dataset]
id = "kanghun_traps_v7"
include_controls = true

[model]
ids = ["Qwen/Qwen3.5-27B"]
dtype = "auto"
device_map = "auto"

[generation]
protocol = "qwen_native"
seeds = [42]
thinking_modes = [false]
output_mode = "binary_choice"
max_new_tokens = 2048

[colab]
gpu = "G4"

[remote]
source = "archive"
repo_dir = "/content/mindscopex_analysis"
output_root = "/content/mindscopex_artifacts"
